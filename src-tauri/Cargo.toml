[package]
name = "cc-login"
version = "0.1.0"
description = "Local account switching for supported AI applications"
edition = "2021"

[lib]
name = "cc_login_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
keyring = "3.6"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11", features = ["tray-icon", "image-png"] }
thiserror = "2"
