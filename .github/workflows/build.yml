name: Build installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            bundles: app,dmg
            artifact: storm-dock-macos
            path: |
              src-tauri/target/release/bundle/dmg/*.dmg
              src-tauri/target/release/bundle/macos/*.app.tar.gz
              src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
          - name: Windows
            os: windows-latest
            bundles: nsis,msi
            artifact: storm-dock-windows
            path: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/msi/*.msi.sig
              src-tauri/target/release/bundle/nsis/*.exe.sig

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Prepare Tauri signing key
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" ]; then
            echo "❌ TAURI_SIGNING_PRIVATE_KEY Secret is empty or missing." >&2
            echo "Add the contents of .tauri/storm-dock.key as a repository secret." >&2
            echo "See docs/updater.md. Tag releases require this secret; workflow_dispatch also needs it because createUpdaterArtifacts is enabled." >&2
            exit 1
          fi

          RAW="${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}"
          KEY_PATH="$RUNNER_TEMP/tauri_signing.key"

          if echo "$RAW" | head -n1 | grep -q '^untrusted comment:'; then
            printf '%s\n' "$RAW" > "$KEY_PATH"
            echo "✅ Using raw two-line key file format"
          else
            if DECODED=$(printf '%s' "$RAW" | (base64 --decode 2>/dev/null || base64 -D 2>/dev/null)) \
               && echo "$DECODED" | head -n1 | grep -q '^untrusted comment:'; then
              printf '%s\n' "$DECODED" > "$KEY_PATH"
              echo "✅ Decoded base64-wrapped key into two-line file"
            elif echo "$RAW" | grep -Eq '^[A-Za-z0-9+/=]+$'; then
              # Single-line base64 blob (Tauri sometimes writes keys this way)
              if DECODED=$(printf '%s' "$RAW" | (base64 --decode 2>/dev/null || base64 -D 2>/dev/null)) \
                 && echo "$DECODED" | head -n1 | grep -q '^untrusted comment:'; then
                printf '%s\n' "$DECODED" > "$KEY_PATH"
                echo "✅ Decoded single-line base64 key"
              else
                ONE=$(printf '%s' "$RAW" | tr -d '\r\n')
                printf '%s\n%s\n' "untrusted comment: tauri signing key" "$ONE" > "$KEY_PATH"
                echo "✅ Constructed two-line file from one-line Base64"
              fi
            else
              echo "❌ TAURI_SIGNING_PRIVATE_KEY format not recognized" >&2
              exit 1
            fi
          fi

          if command -v base64 >/dev/null 2>&1; then
            KEY_B64=$(base64 < "$KEY_PATH" | tr -d '\r\n')
          else
            KEY_B64=$(KEY_PATH="$KEY_PATH" node -e "process.stdout.write(require('fs').readFileSync(process.env.KEY_PATH).toString('base64'))")
          fi
          if [ -z "$KEY_B64" ]; then
            echo "❌ Failed to base64-encode signing key" >&2
            exit 1
          fi
          echo "TAURI_SIGNING_PRIVATE_KEY=$KEY_B64" >> "$GITHUB_ENV"
          if [ -n "${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          fi
          echo "✅ Tauri signing key prepared"

      - name: Build installer
        run: npm run tauri build -- --bundles ${{ matrix.bundles }}

      - name: Ensure macOS updater artifacts
        if: matrix.name == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          MACOS_DIR="src-tauri/target/release/bundle/macos"
          echo "Contents of $MACOS_DIR:"
          ls -la "$MACOS_DIR"

          APP=$(find "$MACOS_DIR" -maxdepth 1 -name '*.app' -type d | head -1 || true)
          if [ -z "$APP" ]; then
            echo "❌ No .app bundle found in $MACOS_DIR" >&2
            exit 1
          fi
          echo "Using app: $APP"

          TAR=$(find "$MACOS_DIR" -maxdepth 1 -name '*.app.tar.gz' -type f | head -1 || true)
          if [ -z "$TAR" ]; then
            # Product names with spaces sometimes skip automatic updater packaging.
            TAR="$MACOS_DIR/$(basename "$APP").tar.gz"
            echo "Creating updater archive: $TAR"
            tar -czf "$TAR" -C "$MACOS_DIR" "$(basename "$APP")"
          fi

          if [ ! -f "$TAR.sig" ]; then
            KEY_PATH="$RUNNER_TEMP/tauri_signing.key"
            if [ ! -f "$KEY_PATH" ]; then
              RAW="${TAURI_SIGNING_PRIVATE_KEY:-}"
              if [ -z "$RAW" ]; then
                echo "❌ Missing TAURI_SIGNING_PRIVATE_KEY to sign macOS updater archive" >&2
                exit 1
              fi
              if echo "$RAW" | head -n1 | grep -q '^untrusted comment:'; then
                printf '%s\n' "$RAW" > "$KEY_PATH"
              else
                printf '%s' "$RAW" | (base64 --decode 2>/dev/null || base64 -D 2>/dev/null) > "$KEY_PATH" || {
                  ONE=$(printf '%s' "$RAW" | tr -d '\r\n')
                  printf '%s\n%s\n' "untrusted comment: tauri signing key" "$ONE" > "$KEY_PATH"
                }
              fi
            fi
            echo "Signing $TAR"
            npx tauri signer sign "$TAR" -f "$KEY_PATH"
          fi

          ls -la "$TAR" "$TAR.sig"
          echo "✅ macOS updater artifacts ready"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (for CHANGELOG)
        uses: actions/checkout@v4

      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            installers/**/*.dmg
            installers/**/*.exe
            installers/**/*.msi
            installers/**/*.tar.gz
            installers/**/*.sig

  assemble-latest-json:
    name: Assemble latest.json
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout (for CHANGELOG notes)
        uses: actions/checkout@v4

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          TAG="${GITHUB_REF_NAME}"
          mkdir -p dl
          gh release download "$TAG" --dir dl --repo "$GITHUB_REPOSITORY"
          ls -la dl || true

      - name: Generate latest.json
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 scripts/generate-latest-json.py
          test -f latest.json

      - name: Upload latest.json to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          gh release upload "$GITHUB_REF_NAME" latest.json --clobber --repo "$GITHUB_REPOSITORY"
