[package]
name = "storm-dock"
version = "1.4.0"
description = "Local account switching for supported AI applications"
edition = "2021"

[lib]
name = "storm_dock_lib"

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
base64 = "0.22"
aes = "0.8"
cbc = "0.1"
pbkdf2 = "0.12"
sha1 = "0.10"
rusqlite = { version = "0.37", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ring = "0.17"
tauri = { version = "2.11", features = ["protocol-asset", "tray-icon", "image-png"] }
thiserror = "2"
time = "0.3"
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tokio = { version = "1", features = ["time"] }
regex = "1.10"
once_cell = "1.21"
dirs = "5.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[profile.dev]
debug = 1

[profile.test]
debug = 1
