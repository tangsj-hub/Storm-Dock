# Storm Dock release pipeline
# Tag v* → build macOS + Windows → publish GitHub Release → assemble latest.json
# Design goals: stable asset names, fail-closed updater artifacts, no partial manifests.
name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-14
            bundles: app,dmg
          - name: Windows
            os: windows-latest
            bundles: nsis,msi

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "VERSION_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            VER=$(node -p "require('./package.json').version")
            echo "VERSION_TAG=v${VER}" >> "$GITHUB_ENV"
          fi
          echo "Resolved VERSION_TAG for packaging"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: ${{ matrix.name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Prepare Tauri signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY_RAW: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bash scripts/ci/prepare-signing-key.sh

      - name: Build Tauri bundles
        shell: bash
        run: |
          set -euo pipefail
          npm run tauri build -- --bundles "${{ matrix.bundles }}"

      - name: Package macOS release assets
        if: matrix.name == 'macOS'
        shell: bash
        run: bash scripts/ci/package-macos-assets.sh

      - name: Package Windows release assets
        if: matrix.name == 'Windows'
        shell: bash
        run: bash scripts/ci/package-windows-assets.sh

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.name }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: collected
          merge-multiple: true

      - name: Stage release-assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          # download-artifact may nest by artifact name depending on merge-multiple
          find collected -type f -print
          find collected -type f -exec cp -n {} release-assets/ \;
          echo "=== staged ==="
          ls -la release-assets/

          need_mac_tar=0
          need_mac_sig=0
          need_mac_dmg=0
          need_win_msi=0
          need_win_msi_sig=0
          for f in release-assets/*; do
            case "$(basename "$f")" in
              Storm-Dock-*-macOS.app.tar.gz) need_mac_tar=1 ;;
              Storm-Dock-*-macOS.app.tar.gz.sig) need_mac_sig=1 ;;
              Storm-Dock-*-macOS.dmg) need_mac_dmg=1 ;;
              Storm-Dock-*-Windows-x64.msi) need_win_msi=1 ;;
              Storm-Dock-*-Windows-x64.msi.sig) need_win_msi_sig=1 ;;
            esac
          done
          if [ "$need_mac_tar" -ne 1 ] || [ "$need_mac_sig" -ne 1 ] || [ "$need_mac_dmg" -ne 1 ]; then
            echo "❌ Incomplete macOS assets in release-assets/" >&2
            ls -la release-assets/ >&2
            exit 1
          fi
          if [ "$need_win_msi" -ne 1 ] || [ "$need_win_msi_sig" -ne 1 ]; then
            echo "❌ Incomplete Windows updater assets in release-assets/" >&2
            ls -la release-assets/ >&2
            exit 1
          fi
          echo "✅ Release asset gate passed"

      - name: Build release notes
        id: notes
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 scripts/changelog-notes.py > notes.json
          python3 -c "import json,pathlib; pathlib.Path('notes.md').write_text(json.load(open('notes.json')), encoding='utf-8')"
          echo "notes file ready"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Storm Dock ${{ github.ref_name }}
          body_path: notes.md
          files: release-assets/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  assemble-latest-json:
    name: Assemble latest.json
    needs: publish-release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          TAG="${GITHUB_REF_NAME}"
          mkdir -p dl
          gh release download "$TAG" --dir dl --repo "$GITHUB_REPOSITORY"
          ls -la dl

      - name: Generate latest.json
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 scripts/generate-latest-json.py
          test -f latest.json
          python3 - <<'PY'
          import json, sys
          data = json.load(open("latest.json"))
          plats = data.get("platforms") or {}
          required = ["darwin-aarch64", "darwin-aarch64-app", "windows-x86_64"]
          missing = [k for k in required if k not in plats]
          if missing:
              raise SystemExit(f"latest.json missing keys: {missing}")
          print("verified platforms:", sorted(plats))
          PY

      - name: Upload latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          gh release upload "$GITHUB_REF_NAME" latest.json --clobber --repo "$GITHUB_REPOSITORY"

      - name: Verify public latest.json
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          URL="https://github.com/${REPO}/releases/download/${TAG}/latest.json"
          echo "Fetching $URL"
          curl -fsSL "$URL" -o /tmp/latest-verify.json
          python3 - <<'PY'
          import json
          data = json.load(open("/tmp/latest-verify.json"))
          plats = data["platforms"]
          for k in ("darwin-aarch64", "darwin-aarch64-app", "windows-x86_64"):
              assert k in plats, k
              assert plats[k].get("url") and plats[k].get("signature"), k
          print("✅ public latest.json OK", data["version"], sorted(plats))
          PY
