name: Build installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            bundles: dmg
            artifact: storm-dock-macos
            path: |
              src-tauri/target/release/bundle/dmg/*.dmg
              src-tauri/target/release/bundle/macos/*.app.tar.gz
              src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
          - name: Windows
            os: windows-latest
            bundles: nsis,msi
            artifact: storm-dock-windows
            path: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/msi/*.msi.sig
              src-tauri/target/release/bundle/nsis/*.exe.sig

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Prepare Tauri signing key
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" ]; then
            echo "❌ TAURI_SIGNING_PRIVATE_KEY Secret is empty or missing." >&2
            echo "Add the contents of .tauri/storm-dock.key as a repository secret." >&2
            echo "See docs/updater.md. Tag releases require this secret; workflow_dispatch also needs it because createUpdaterArtifacts is enabled." >&2
            exit 1
          fi

          RAW="${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}"
          KEY_PATH="$RUNNER_TEMP/tauri_signing.key"

          if echo "$RAW" | head -n1 | grep -q '^untrusted comment:'; then
            printf '%s\n' "$RAW" > "$KEY_PATH"
            echo "✅ Using raw two-line key file format"
          else
            if DECODED=$(printf '%s' "$RAW" | (base64 --decode 2>/dev/null || base64 -D 2>/dev/null)) \
               && echo "$DECODED" | head -n1 | grep -q '^untrusted comment:'; then
              printf '%s\n' "$DECODED" > "$KEY_PATH"
              echo "✅ Decoded base64-wrapped key into two-line file"
            elif echo "$RAW" | grep -Eq '^[A-Za-z0-9+/=]+$'; then
              # Single-line base64 blob (Tauri sometimes writes keys this way)
              if DECODED=$(printf '%s' "$RAW" | (base64 --decode 2>/dev/null || base64 -D 2>/dev/null)) \
                 && echo "$DECODED" | head -n1 | grep -q '^untrusted comment:'; then
                printf '%s\n' "$DECODED" > "$KEY_PATH"
                echo "✅ Decoded single-line base64 key"
              else
                ONE=$(printf '%s' "$RAW" | tr -d '\r\n')
                printf '%s\n%s\n' "untrusted comment: tauri signing key" "$ONE" > "$KEY_PATH"
                echo "✅ Constructed two-line file from one-line Base64"
              fi
            else
              echo "❌ TAURI_SIGNING_PRIVATE_KEY format not recognized" >&2
              exit 1
            fi
          fi

          if command -v base64 >/dev/null 2>&1; then
            KEY_B64=$(base64 < "$KEY_PATH" | tr -d '\r\n')
          else
            KEY_B64=$(KEY_PATH="$KEY_PATH" node -e "process.stdout.write(require('fs').readFileSync(process.env.KEY_PATH).toString('base64'))")
          fi
          if [ -z "$KEY_B64" ]; then
            echo "❌ Failed to base64-encode signing key" >&2
            exit 1
          fi
          echo "TAURI_SIGNING_PRIVATE_KEY=$KEY_B64" >> "$GITHUB_ENV"
          if [ -n "${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          fi
          echo "✅ Tauri signing key prepared"

      - name: Build installer
        run: npm run tauri build -- --bundles ${{ matrix.bundles }}

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (for CHANGELOG)
        uses: actions/checkout@v4

      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            installers/**/*.dmg
            installers/**/*.exe
            installers/**/*.msi
            installers/**/*.tar.gz
            installers/**/*.sig

  assemble-latest-json:
    name: Assemble latest.json
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout (for CHANGELOG notes)
        uses: actions/checkout@v4

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          TAG="${GITHUB_REF_NAME}"
          mkdir -p dl
          gh release download "$TAG" --dir dl --repo "$GITHUB_REPOSITORY"
          ls -la dl || true

      - name: Generate latest.json
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          base_url="https://github.com/$REPO/releases/download/$TAG"

          # Prefer CHANGELOG section for this version as notes
          NOTES_JSON=$(python3 -c '
import json, os, re, pathlib
tag = os.environ["TAG"]
version = tag.lstrip("v")
notes = f"Release {tag}"
path = pathlib.Path("CHANGELOG.md")
if path.exists():
    text = path.read_text(encoding="utf-8")
    pattern = rf"^## \[?{re.escape(version)}\]?[^\n]*\n(.*?)(?=^## |\Z)"
    m = re.search(pattern, text, flags=re.M | re.S)
    if m:
        body = re.sub(r"<!--.*?-->", "", m.group(1), flags=re.S).strip()
        if body:
            notes = body[:4000]
print(json.dumps(notes))
')

          mac_url=""; mac_sig=""
          win_x64_url=""; win_x64_sig=""

          shopt -s nullglob
          for sig in dl/*.sig; do
            base=${sig%.sig}
            fname=$(basename "$base")
            url="$base_url/$fname"
            # Keep signature as a single line for JSON
            sig_content=$(tr -d '\r\n' < "$sig")
            case "$fname" in
              *.app.tar.gz|*.tar.gz)
                mac_url="$url"; mac_sig="$sig_content";;
              *.msi)
                win_x64_url="$url"; win_x64_sig="$sig_content";;
              *.exe)
                # Prefer MSI for Windows updater when both exist; keep exe as fallback
                if [ -z "$win_x64_url" ]; then
                  win_x64_url="$url"; win_x64_sig="$sig_content"
                fi
                ;;
            esac
          done

          tmp_json=$(mktemp)
          {
            echo '{'
            echo "  \"version\": \"$VERSION\","
            echo "  \"notes\": $NOTES_JSON,"
            echo "  \"pub_date\": \"$PUB_DATE\","
            echo '  "platforms": {'
            first=1
            if [ -n "$mac_url" ] && [ -n "$mac_sig" ]; then
              for key in darwin-aarch64 darwin-x86_64; do
                [ $first -eq 0 ] && echo ','
                echo "    \"$key\": {\"signature\": \"$mac_sig\", \"url\": \"$mac_url\"}"
                first=0
              done
            fi
            if [ -n "$win_x64_url" ] && [ -n "$win_x64_sig" ]; then
              [ $first -eq 0 ] && echo ','
              echo "    \"windows-x86_64\": {\"signature\": \"$win_x64_sig\", \"url\": \"$win_x64_url\"}"
              first=0
            fi
            echo
            echo '  }'
            echo '}'
          } > "$tmp_json"

          echo "Generated latest.json:"
          cat "$tmp_json"
          python3 -c 'import json,sys; json.load(open(sys.argv[1]))' "$tmp_json"
          mv "$tmp_json" latest.json

          if [ -z "$mac_url" ] && [ -z "$win_x64_url" ]; then
            echo "❌ No signed updater artifacts found for latest.json" >&2
            exit 1
          fi

      - name: Upload latest.json to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          gh release upload "$GITHUB_REF_NAME" latest.json --clobber --repo "$GITHUB_REPOSITORY"
